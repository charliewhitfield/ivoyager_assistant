; This file's values can be overridden by project level override config file(s):
;
;   res://ivoyager_override.cfg
;   res://ivoyager_override2.cfg (overrides above if present)
;
; Paths can be absolute or relative to res://addons/ivoyager_assistant/editor/editor_plugin.gd.

[assistant_autoload]

IVAssistantServer="../assistant_server.gd"
IVAssistant="../assistant/assistant.gd"

[assistant_server]

enabled=true
debug_only=true
port=29071
min_ready_delay_frames=10
context_file=""

[assistant]

enabled=false
assistant_name=""
instructions_file=""

[assistant_tool_sets]

; Each key names a set of tools a model may be given. An entry is a method the
; user's assistant answers, or "<object>.<method>", a user method of the object
; at that address. A project adds sets, or removes this one with full=null.
full=["describe", "get", "call", "list_widgets", "operate_widget", "list_actions", "press_action"]
