; This file's values can be overridden by project level override config file(s):
;
;   res://ivoyager_override.cfg
;   res://ivoyager_override2.cfg (overrides above if present)
;
; Paths can be absolute or relative to res://addons/ivoyager_assistant/editor/editor_plugin.gd.

[assistant_autoload]

IVAssistantServer="../assistant_server.gd"
IVAssistant="../assistant/assistant.gd"

[assistant_server]

enabled=true
debug_only=true
port=29071
min_ready_delay_frames=10
context_file=""

[assistant]

enabled=false
assistant_name=""
instructions_file=""
; Where the setup wizard's experimental notice asks users to send feedback.
feedback_url="https://github.com/orgs/ivoyager/discussions"
; Whether the chat box shows the tools the assistant calls ("API commands").
show_api_commands=false
; Whether the user may change it: in an I, Voyager Core project, this adds user
; setting "show_api_commands" (default show_api_commands), which the project may
; show as an option. False holds show_api_commands for every user.
show_api_commands_setting=true
; The translations of the plugin's text that IVAssistant adds while enabled.
; Godot adds the project's own (Project Settings, Localization) first, and the
; first added wins, so a project gives one of the plugin's text keys new words in
; a translation of its own.
translations=["res://addons/ivoyager_assistant/text/assistant_text.en.translation"]
; The providers the setup wizard offers, in order, each described in its
; [assistant_provider_<id>] section below. A project offers a subset, or adds
; its own section.
providers=["ollama", "lm_studio", "llama_server", "gemini", "groq", "openrouter", "anthropic", "openai", "poe"]
; A provider every user gets, which hides the setup wizard: a server the project
; runs or ships, which needs no key. Its section's model is used.
preset_provider=""
; The tool set a new connection gets: for a provider with small_models, and for
; one without.
small_model_tool_set="full"
large_model_tool_set="full"

[assistant_tool_sets]

; Each key names a set of tools a model may be given. An entry is a method the
; user's assistant answers, or "<object>.<method>", a user method of the object
; at that address. A project adds sets, or removes this one with full=null.
full=["describe", "get", "call", "list_widgets", "operate_widget", "list_actions", "press_action"]

; Model providers. Each section's keys, all optional but name and url:
;   name           display name, or its text key
;   adapter        "openai" (OpenAI-compatible chat completions; the default),
;                  "anthropic" (Anthropic's Messages API), or the path of a
;                  project's IVAssistantConnection script
;   url            the API base, without a trailing slash
;   local          whether the server runs on the user's computer (false)
;   small_models   whether a new connection gets small_model_tool_set (= local)
;   needs_key      whether the user gives a key (= not local)
;   key_url        where the user gets a key
;   site           where the user learns more, or downloads the server
;   model          the model offered first
;   note           what the setup wizard says about it: a text key or text
;   web            whether a web build offers it: the service must accept calls
;                  from a page (CORS) (true)
;   web_note       what the wizard adds in a web build: a text key or text
;   simple_schemas whether tool parameters must be simplified (false)
; Facts here and in the notes' text (text/assistant_text.csv) are as of October 2026.

[assistant_provider_ollama]

name="Ollama"
url="http://127.0.0.1:11434/v1"
local=true
site="https://ollama.com"
note="TXT_ASSISTANT_NOTE_OLLAMA"
web_note="TXT_ASSISTANT_WEB_NOTE_OLLAMA"

[assistant_provider_lm_studio]

name="LM Studio"
url="http://127.0.0.1:1234/v1"
local=true
site="https://lmstudio.ai"
note="TXT_ASSISTANT_NOTE_LM_STUDIO"
web_note="TXT_ASSISTANT_WEB_NOTE_LM_STUDIO"

[assistant_provider_llama_server]

name="llama.cpp server"
url="http://127.0.0.1:8080/v1"
local=true
site="https://github.com/ggml-org/llama.cpp"
note="TXT_ASSISTANT_NOTE_LLAMA_SERVER"
web_note="TXT_ASSISTANT_WEB_NOTE_LLAMA_SERVER"

[assistant_provider_gemini]

name="Google Gemini"
url="https://generativelanguage.googleapis.com/v1beta/openai"
key_url="https://aistudio.google.com/apikey"
model="gemini-3.8-flash"
simple_schemas=true
note="TXT_ASSISTANT_NOTE_GEMINI"

[assistant_provider_groq]

name="Groq"
url="https://api.groq.com/openai/v1"
key_url="https://console.groq.com/keys"
model="openai/gpt-oss-120b"
; Its free plan's tokens per minute fit a short tool list.
small_models=true
note="TXT_ASSISTANT_NOTE_GROQ"

[assistant_provider_openrouter]

name="OpenRouter"
url="https://openrouter.ai/api/v1"
key_url="https://openrouter.ai/settings/keys"
model="openrouter/free"
note="TXT_ASSISTANT_NOTE_OPENROUTER"

[assistant_provider_anthropic]

name="Anthropic (Claude)"
adapter="anthropic"
url="https://api.anthropic.com/v1"
key_url="https://platform.claude.com/settings/keys"
model="claude-opus-5-5"
note="TXT_ASSISTANT_NOTE_ANTHROPIC"

[assistant_provider_openai]

name="OpenAI"
url="https://api.openai.com/v1"
key_url="https://platform.openai.com/api-keys"
model="gpt-6-luna"
note="TXT_ASSISTANT_NOTE_OPENAI"

[assistant_provider_poe]

name="Poe"
url="https://api.poe.com/v1"
key_url="https://poe.com/api/keys"
model="claude-sonnet-5.5"
note="TXT_ASSISTANT_NOTE_POE"
