[assistant_autoload]

IVAssistantServer="../assistant_server.gd"

[assistant_test_suites]

; Helper suites for what no class can declare. Classes declare their own
; automation members (SPECIFICATION.md section 11).
;
; DEPRECATED: the suites below bind to Core and are replaced by Core's own
; declarations. They remain for projects that haven't moved to describe, get
; and call, and will be removed. A project negates one with an empty value.
StateQuerySuite="res://addons/ivoyager_assistant/test_suites/state_query_suite.gd"
ControlSuite="res://addons/ivoyager_assistant/test_suites/control_suite.gd"
ViewSuite="res://addons/ivoyager_assistant/test_suites/view_suite.gd"
SettingsSuite="res://addons/ivoyager_assistant/test_suites/settings_suite.gd"
CoreTestSuite="res://addons/ivoyager_assistant/test_suites/core_test_suite.gd"
MouseTargetIdSuite="res://addons/ivoyager_assistant/test_suites/mouse_target_id_suite.gd"
SmallBodiesIdSuite="res://addons/ivoyager_assistant/test_suites/small_bodies_id_suite.gd"

[assistant]

port=29071
enabled=true
debug_only=true
assistant_name=""
context_file=""
min_ready_delay_frames=10
